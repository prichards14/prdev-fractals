<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hilbert Dragon — C64 Fractal Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c64-bg: #0000aa;
    --c64-blue: #3535cd;
    --c64-bright: #aaaaff;
    --c64-mid: #7070e8;
    --c64-white: #ffffff;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'VT323', monospace;
  }

  html, body {
    height: 100%;
    background: #111;
    color: #ccc;
    font-family: var(--font-mono);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px 32px;
    background:
      radial-gradient(ellipse at 50% 0%, #0a0a2a 0%, #0a0808 60%, #111 100%);
  }

  header {
    text-align: center;
    margin-bottom: 20px;
    user-select: none;
  }

  header h1 {
    font-family: var(--font-display);
    font-size: 52px;
    color: var(--c64-bright);
    letter-spacing: 4px;
    line-height: 1;
    text-shadow: 0 0 24px #3535cdaa, 0 0 60px #0000aa66;
  }

  header p {
    font-size: 11px;
    color: var(--c64-mid);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .shell {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .panel {
    background: #0a0a1a;
    border: 1px solid var(--c64-blue);
    border-radius: 4px;
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .panel-label {
    font-size: 10px;
    color: var(--c64-mid);
    letter-spacing: 2px;
    text-transform: uppercase;
    width: 100%;
    margin-bottom: 2px;
    border-bottom: 1px solid #1a1a3a;
    padding-bottom: 4px;
  }

  .btn-group { display: flex; gap: 4px; flex-wrap: wrap; }

  button {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 5px 13px;
    background: transparent;
    border: 1px solid var(--c64-blue);
    color: var(--c64-mid);
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 1px;
    transition: all 0.12s;
  }
  button:hover {
    background: #1a1a40;
    color: var(--c64-bright);
    border-color: var(--c64-bright);
  }
  button.active {
    background: var(--c64-blue);
    color: var(--c64-white);
    border-color: var(--c64-bright);
  }

  select {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 5px 10px;
    background: #0a0a1a;
    border: 1px solid var(--c64-blue);
    color: var(--c64-mid);
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 1px;
    outline: none;
  }
  select:hover { border-color: var(--c64-bright); color: var(--c64-bright); }

  .slider-row {
    display: flex; align-items: center; gap: 8px;
  }
  .slider-row label {
    font-size: 11px; color: var(--c64-mid); letter-spacing: 1px;
    text-transform: uppercase;
  }
  .slider-row input[type=range] {
    -webkit-appearance: none;
    width: 130px; height: 4px;
    background: var(--c64-blue);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--c64-bright);
    border-radius: 50%; border: 2px solid #0a0a1a;
    box-shadow: 0 0 8px var(--c64-bright);
  }
  .slider-row span {
    font-size: 13px; min-width: 22px;
    color: var(--c64-bright); text-align: right;
  }

  .canvas-wrap {
    position: relative;
    background: #000010;
    border: 1px solid var(--c64-blue);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 40px #0000aa44 inset, 0 0 2px var(--c64-blue);
  }

  /* scanline overlay */
  .canvas-wrap::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 2px,
      rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    border-radius: 4px;
  }

  canvas {
    display: block;
    width: 100%;
    image-rendering: pixelated;
  }

  .info-bar {
    display: flex; gap: 20px; flex-wrap: wrap;
    font-size: 11px; color: var(--c64-mid);
    letter-spacing: 1px;
  }
  .info-bar .kv { display: flex; gap: 6px; }
  .info-bar .k { color: #4444aa; text-transform: uppercase; }
  .info-bar .v { color: var(--c64-bright); }

  .mode-desc {
    font-size: 11px;
    color: #5555aa;
    line-height: 1.6;
    letter-spacing: 0.5px;
    padding: 8px 14px;
    background: #080818;
    border: 1px solid #1a1a3a;
    border-left: 3px solid var(--c64-blue);
    border-radius: 2px;
  }

  footer {
    margin-top: 20px;
    font-size: 10px;
    color: #2a2a5a;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>HILBERT DRAGON</h1>
  <p>C64 Fractal Explorer &mdash; 6510 Assembly Tribute</p>
</header>

<div class="shell">

  <div class="panel">
    <div class="panel-label">Curve type</div>
    <div class="btn-group">
      <button id="btnDragon" class="active" onclick="setMode('dragon')">Dragon curve</button>
      <button id="btnHilbert" onclick="setMode('hilbert')">Hilbert curve</button>
      <button id="btnTwin" onclick="setMode('twin')">Twin dragon</button>
    </div>

    <div class="slider-row">
      <label for="iterSlider">Depth</label>
      <input type="range" id="iterSlider" min="1" max="16" value="10" step="1" oninput="onIterChange(this.value)">
      <span id="iterVal">10</span>
    </div>

    <div class="btn-group">
      <button id="btnAnimate" onclick="toggleAnimate()">&#9654; Animate</button>
      <button onclick="draw()">Redraw</button>
    </div>

    <select id="paletteSelect" onchange="draw()">
      <option value="c64">C64 blue</option>
      <option value="c64hi">C64 hi-res</option>
      <option value="green">Phosphor green</option>
      <option value="amber">Phosphor amber</option>
      <option value="spectrum">Spectrum</option>
      <option value="modern">Modern</option>
    </select>
  </div>

  <p class="mode-desc" id="modeDesc"></p>

  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
  </div>

  <div class="info-bar">
    <div class="kv"><span class="k">Mode</span><span class="v" id="infoMode">Dragon curve</span></div>
    <div class="kv"><span class="k">Depth</span><span class="v" id="infoDepth">10</span></div>
    <div class="kv"><span class="k">Segments</span><span class="v" id="infoSegs">—</span></div>
    <div class="kv"><span class="k">Draw time</span><span class="v" id="infoTime">—</span></div>
  </div>

</div>

<footer>Inspired by C64 type-in programs circa 1984&ndash;1987</footer>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let mode = 'dragon';
let depth = 10;
let animating = false;
let animFrame = null;

const W = 720, H = 500;
cv.width = W; cv.height = H;

const DESCS = {
  dragon: "Dragon curve (Harter-Heighway) — generated by repeatedly folding a strip of paper in half and unfolding at 90°. Each iteration doubles the segment count. The C64 type-in programs rendered this in pure 6510 assembly at up to depth 12 before running out of memory.",
  hilbert: "Hilbert curve — a continuous space-filling fractal that visits every point in a 2D grid exactly once. Named after David Hilbert (1891). Some C64 programs labeled Dragon curves as 'Hilbert Dragons' because of how densely they fill space at higher iterations.",
  twin: "Twin dragon — two Dragon curves joined at their endpoints and rotated 180° from each other. Tiles the plane perfectly. This variant appeared in more advanced C64 demo scene programs and creates the most dramatic imagery of the three."
};

const PALETTES = {
  c64:    { bg: '#0000aa', line: '#7070e8' },
  c64hi:  { bg: '#000000', line: '#aaaaff' },
  green:  { bg: '#001a00', line: '#00cc44' },
  amber:  { bg: '#1a0d00', line: '#ffaa00' },
  spectrum: { bg: '#000000', line: null },
  modern: { bg: '#0a0a12', line: null }
};

function getPalKey() { return document.getElementById('paletteSelect').value; }

const MODE_LABELS = { dragon: 'Dragon curve', hilbert: 'Hilbert curve', twin: 'Twin dragon' };
const MODE_MAX    = { dragon: 16, hilbert: 8, twin: 16 };

function setMode(m) {
  mode = m;
  ['Dragon','Hilbert','Twin'].forEach(n =>
    document.getElementById('btn'+n).classList.remove('active'));
  document.getElementById('btn' + m[0].toUpperCase() + m.slice(1)).classList.add('active');
  document.getElementById('modeDesc').textContent = DESCS[m];
  document.getElementById('infoMode').textContent = MODE_LABELS[m];
  const maxD = MODE_MAX[m];
  document.getElementById('iterSlider').max = maxD;
  if (depth > maxD) {
    depth = maxD;
    document.getElementById('iterSlider').value = depth;
    document.getElementById('iterVal').textContent = depth;
  }
  draw();
}

function onIterChange(v) {
  depth = parseInt(v);
  document.getElementById('iterVal').textContent = depth;
  draw();
}

/* ---- Dragon curve ---- */
function dragonTurns(n) {
  let turns = [1];
  for (let i = 1; i < n; i++) {
    const rev = turns.slice().reverse().map(t => -t);
    turns = turns.concat([1], rev);
  }
  return turns;
}

function buildDragonPath(n) {
  const turns = dragonTurns(n);
  const pts = [{x:0, y:0}];
  let dx = 1, dy = 0;
  for (const t of turns) {
    if (t === 1) { const nx = -dy; dy = dx; dx = nx; }
    else         { const nx =  dy; dy = -dx; dx = nx; }
    const last = pts[pts.length-1];
    pts.push({x: last.x + dx, y: last.y + dy});
  }
  return pts;
}

/* ---- Hilbert curve ---- */
function buildHilbertPath(n) {
  const size = 1 << n;
  const pts = [];
  for (let i = 0; i < size * size; i++) pts.push(d2xy(size, i));
  return pts;
}

function d2xy(n, d) {
  let rx, ry, s, t = d, x = 0, y = 0;
  for (s = 1; s < n; s <<= 1) {
    rx = 1 & (t >> 1);
    ry = 1 & (t ^ rx);
    if (ry === 0) {
      if (rx === 1) { x = s-1-x; y = s-1-y; }
      let tmp = x; x = y; y = tmp;
    }
    x += s * rx; y += s * ry; t >>= 2;
  }
  return {x, y};
}

/* ---- Twin dragon ---- */
function buildTwinPath(n) {
  const a = buildDragonPath(n);
  const last = a[a.length - 1];
  const b = a.slice().reverse().map(p => ({x: 2*last.x - p.x, y: 2*last.y - p.y}));
  return [...a, ...b];
}

/* ---- Fit + draw ---- */
function fitToCanvas(pts, pad) {
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const p of pts) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  const scaleX = (W - pad*2) / (maxX - minX || 1);
  const scaleY = (H - pad*2) / (maxY - minY || 1);
  const scale = Math.min(scaleX, scaleY);
  const offX = pad + ((W - pad*2) - (maxX - minX)*scale) / 2 - minX*scale;
  const offY = pad + ((H - pad*2) - (maxY - minY)*scale) / 2 - minY*scale;
  return pts.map(p => ({x: p.x*scale + offX, y: p.y*scale + offY}));
}

function spectrumColor(i, total) { return `hsl(${(i/total)*300},90%,62%)`; }
function modernColor(i, total)   { return `hsl(${(i/total)*360},75%,58%)`; }

function draw() {
  const t0 = performance.now();
  const palKey = getPalKey();
  const pal = PALETTES[palKey];

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = pal.bg || '#0a0a12';
  ctx.fillRect(0, 0, W, H);

  let pts;
  if      (mode === 'dragon')  pts = buildDragonPath(depth);
  else if (mode === 'hilbert') pts = buildHilbertPath(Math.min(depth, 8));
  else                         pts = buildTwinPath(depth);

  const mapped = fitToCanvas(pts, 28);
  const segs = mapped.length - 1;
  const useColor = !pal.line;
  const colorFn = palKey === 'spectrum' ? spectrumColor : modernColor;

  ctx.lineWidth = Math.max(0.5, Math.min(2, 500 / segs));
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (!useColor) {
    ctx.strokeStyle = pal.line;
    ctx.beginPath();
    ctx.moveTo(mapped[0].x, mapped[0].y);
    for (let i = 1; i < mapped.length; i++) ctx.lineTo(mapped[i].x, mapped[i].y);
    ctx.stroke();
  } else {
    for (let i = 0; i < segs; i++) {
      ctx.strokeStyle = colorFn(i, segs);
      ctx.beginPath();
      ctx.moveTo(mapped[i].x, mapped[i].y);
      ctx.lineTo(mapped[i+1].x, mapped[i+1].y);
      ctx.stroke();
    }
  }

  const elapsed = Math.round(performance.now() - t0);
  document.getElementById('infoSegs').textContent = segs.toLocaleString();
  document.getElementById('infoTime').textContent = elapsed + ' ms';
  document.getElementById('infoDepth').textContent = depth;
}

function toggleAnimate() {
  animating = !animating;
  const btn = document.getElementById('btnAnimate');
  if (animating) {
    btn.textContent = '\u23F9 Stop';
    btn.classList.add('active');
    let d = 1;
    const maxD = MODE_MAX[mode];
    function step() {
      depth = d;
      document.getElementById('iterSlider').value = d;
      document.getElementById('iterVal').textContent = d;
      draw();
      d = d >= maxD ? 1 : d + 1;
      if (animating) animFrame = setTimeout(step, 600);
    }
    step();
  } else {
    btn.textContent = '\u25B6 Animate';
    btn.classList.remove('active');
    clearTimeout(animFrame);
  }
}

// Init
document.getElementById('modeDesc').textContent = DESCS['dragon'];
draw();
</script>
</body>
</html>
